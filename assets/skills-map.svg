  <path class="link" d="M255,495 C220,505 160,510 95,522"/>
  <path class="link" d="M280,495 C280,505 275,510 245,522"/>
  <path class="link" d="M255,495 C200,520 160,540 115,567"/>
  <path class="link" d="M280,495 C260,520 250,540 240,567"/>

