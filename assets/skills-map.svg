      .leaf-text { fill: #c0caf5; font-weight: 600; font-size: 13px; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="15" width="1000" height="620" rx="12"/>

  <!-- ===== Links: center to branch nodes ===== -->
  <path class="link" d="M420,230 C400,230 380,220 330,200"/>
  <path class="link" d="M500,200 C500,180 500,170 500,150"/>
  <path class="link" d="M580,230 C600,230 620,220 670,200"/>
  <path class="link" d="M420,380 C400,380 380,400 320,470"/>
  <path class="link" d="M580,380 C600,380 630,400 690,470"/>

